<!DOCTYPE html>
<html>
<head>
    <title>Quotation and Citation</title>
</head>

<body>

    <div style="border:1px solid green; padding:30px; margin:20px;">

        <blockquote>
            The best way to predict the future is to create it.
        </blockquote>

        <p>
            As he said,
            <q>Stay hungry, stay foolish.</q>
        </p>

        <p>
            Book: <cite>The Pragmatic Programmer</cite>
        </p>

        <p>
            <abbr title="World Wide Web Consortium">W3C</abbr>
            sets web standards.
        </p>

        <address>
            Contact: Admin Office<br>
            College Road, Delhi
        </address>

        <p>
            <del>Old price 500</del>
            <ins>New price 400</ins>
        </p>

    </div>

    <p>
        <b>Note:</b>
        <i>Hovering over W3C shows the full form as a tooltip.</i>
    </p>

</body>
</html>
